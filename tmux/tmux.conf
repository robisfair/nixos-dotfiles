# Enable mouse support
set -g mouse on

# Move status bar to the top
set -g status-position top

# Start window and pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Kill pane without confirmation prompt
bind x kill-pane

# --- Catppuccin Mocha Theme ---
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 100
set -g status-left ""

set -g status-right-length 100
set -g status-right "#[bg=#313244,fg=#cba6f7] %Y-%m-%d #[bg=#313244,fg=#cdd6f4] %H:%M "

set -g window-status-format " #I #W "
set -g window-status-style "bg=#1e1e2e,fg=#6c7086"
set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#313244,fg=#cba6f7,bold"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
