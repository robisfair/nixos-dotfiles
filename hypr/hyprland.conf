# MONITORS
monitor = , preferred, auto, auto

# AUTOSTART
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hyprctl dismissnotify
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user stop hyprland-session.target
exec-once = systemctl --user start hyprland-session.target

# LOOK AND FEEL
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha Active/Inactive Borders
    col.active_border = rgba(89b4faee) rgba(b4befeee) 45deg
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 8

    # Window Transparency
    active_opacity = 0.95
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# KEYBINDINGS
$mainMod = SUPER

bind = $mainMod, Return, exec, ghostty
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, B, exec, firefox
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, F, fullscreen, 0

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces 1-3
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
